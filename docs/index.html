<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cyanocast Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Thème gris de CameraMap (vue pinpoints) : clair par défaut, sombre selon le système */
  :root {
    --font-main: 'Rajdhani', 'Segoe UI', sans-serif;
    --font-mono: 'Share Tech Mono', ui-monospace, monospace;
    --bg: #f5f5f0;
    --bg-panel: rgba(240, 240, 235, 0.60);
    --bg-field: rgba(255, 255, 255, 0.55);
    --text: #0a0a0a;
    --accent: #5f5f5f;
    --accent-alt: #4a4a4a;
    --accent-glow: rgba(60, 60, 60, .12);
    --border: rgba(60, 60, 60, .22);
    --border-strong: rgba(60, 60, 60, .42);
    --muted: #7a7a80;
    --item-hover: rgba(60, 60, 60, .07);
    --grid-color: rgba(60, 60, 60, .05);
    --vignette: rgba(0, 0, 0, 0.15);
    --danger: #d92b3f;
    --ok: #1f9d55;
    --hi: rgba(255, 255, 255, 0.75);
    --shade: rgba(0, 0, 0, .08);
    --on-accent: #f5f5f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --bg-panel: rgba(12, 12, 12, 0.58);
      --bg-field: rgba(0, 0, 0, 0.4);
      --text: #e8e8e0;
      --accent: #a4a49c;
      --accent-alt: #8a8a84;
      --accent-glow: rgba(200, 200, 190, .1);
      --border: rgba(200, 200, 190, .2);
      --border-strong: rgba(200, 200, 190, .4);
      --muted: #888880;
      --item-hover: rgba(200, 200, 190, .07);
      --grid-color: rgba(200, 200, 190, .035);
      --vignette: rgba(0, 0, 0, 0.45);
      --danger: #ff4757;
      --ok: #2ecc71;
      --hi: rgba(255, 255, 255, 0.07);
      --shade: rgba(0, 0, 0, .55);
      --on-accent: #0a0a0a;
    }
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-main); font-size: 15px; line-height: 1.4;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: grid; place-items: start center;
    padding: 28px 16px 64px; -webkit-font-smoothing: antialiased;
  }

  #bg-grid, #overlay-scanlines, #overlay-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #bg-grid {
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  #overlay-scanlines {
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }
  #overlay-vignette { background: radial-gradient(ellipse at center, transparent 55%, var(--vignette) 100%); }

  #panel {
    position: relative; z-index: 1; width: 100%; max-width: 440px;
    background: var(--bg-panel); color: var(--text);
    padding: 22px 20px 24px;
    border: 1px solid var(--border-strong); border-radius: 2px;
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 var(--hi);
  }
  .panel-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .header-line { height: 1px; background: linear-gradient(90deg, var(--accent), transparent); opacity: .45; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: var(--accent); }
  .header-sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }

  form { display: grid; gap: 14px; }
  label {
    display: grid; gap: 5px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
  input, textarea {
    font-family: var(--font-mono); font-size: 12px; color: var(--text);
    background: var(--bg-field); box-shadow: 0 1px 0 var(--shade);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
  input[type="file"] { padding: 7px 8px; }
  input[type="file"]::file-selector-button {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--accent); background: none; border: 1px solid var(--border-strong); border-radius: 2px;
    padding: 4px 10px; margin-right: 10px; cursor: pointer;
  }
  textarea { min-height: 110px; resize: vertical; }

  button {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; padding: 11px 14px; border-radius: 2px;
    color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent);
    box-shadow: 0 0 14px var(--accent-glow); transition: filter .2s, box-shadow .2s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 18px var(--accent-glow); }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  button:disabled { opacity: .45; cursor: default; }
  button.link {
    justify-self: start; background: none; box-shadow: none; color: var(--accent);
    border-color: var(--border-strong); padding: 7px 12px;
  }
  button.link:hover:not(:disabled) { background: var(--item-hover); border-color: var(--accent); box-shadow: none; filter: none; }

  #status { min-height: 1.5em; margin-top: 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  .ok { color: var(--ok) !important; } .err { color: var(--danger) !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bg-grid"></div>
<div id="overlay-scanlines"></div>
<div id="overlay-vignette"></div>

<main id="panel">
  <div class="panel-header">
    <div class="header-line"></div>
    <h1>Cyanocast</h1>
    <div class="header-sub">Console de publication</div>
    <div class="header-line"></div>
  </div>
<form id="login" hidden>
  <label>E-mail <input id="email" type="email" autocomplete="username" required></label>
  <label>Mot de passe <input id="password" type="password" autocomplete="current-password" required></label>
  <button>Se connecter</button>
</form>

<form id="publish" hidden>
  <label>Fichier audio (mp3) <input id="audio" type="file" accept="audio/mpeg,.mp3" required></label>
  <label>Titre <input id="title" required></label>
  <label>Description <textarea id="description"></textarea></label>
  <label>Numéro d'épisode (optionnel) <input id="number" type="number" min="1"></label>
  <label>Image de l'épisode, carrée (optionnel) <input id="cover" type="file" accept="image/jpeg,image/png"></label>
  <button id="submit">Publier</button>
  <button type="button" class="link" id="logout">Se déconnecter</button>
</form>

  <p id="status" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://sanopnzbhcrnqkxwulrs.supabase.co";
// Clé publique (anon) : sans danger dans un dépôt public, la sécurité repose sur les règles RLS.
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhbm9wbnpiaGNybnFreHd1bHJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNDIxNTEsImV4cCI6MjEwODkxODE1MX0.sl3F0ReIZZhXql0bLNbrEusV3BjI2uq852SikvSJSjc";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);

function say(msg, cls = "") { const s = $("status"); s.textContent = msg; s.className = cls; }

function show(session) {
  $("login").hidden = !!session;
  $("publish").hidden = !session;
}

function slug(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "episode";
}

function audioDuration(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const a = new Audio();
    a.preload = "metadata";
    a.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(Math.round(a.duration)); };
    a.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Impossible de lire la durée du fichier")); };
    a.src = url;
  });
}

async function upload(bucket, path, file) {
  const { error } = await sb.storage.from(bucket).upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  say("Connexion…");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) return say("Connexion refusée : " + error.message, "err");
  say("");
});

$("logout").addEventListener("click", () => sb.auth.signOut());

$("publish").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("submit");
  btn.disabled = true;
  const uploaded = [];
  try {
    const audio = $("audio").files[0];
    const cover = $("cover").files[0];
    const title = $("title").value.trim();
    const stamp = new Date().toISOString().slice(0, 10);
    const base = `${stamp}-${slug(title)}-${Date.now().toString(36)}`;

    say("Lecture de la durée…");
    const duration = await audioDuration(audio);

    say("Envoi de l'audio…");
    const audioPath = `${base}.mp3`;
    const audioUrl = await upload("audio", audioPath, audio);
    uploaded.push(["audio", audioPath]);

    let imageUrl = null;
    if (cover) {
      say("Envoi de l'image…");
      const ext = cover.type === "image/png" ? "png" : "jpg";
      const imagePath = `${base}.${ext}`;
      imageUrl = await upload("images", imagePath, cover);
      uploaded.push(["images", imagePath]);
    }

    say("Publication…");
    const { error } = await sb.from("episodes").insert({
      title,
      description: $("description").value.trim(),
      audio_url: audioUrl,
      audio_bytes: audio.size,
      audio_type: "audio/mpeg",
      duration_seconds: duration,
      image_url: imageUrl,
      episode_number: $("number").value ? Number($("number").value) : null,
    });
    if (error) throw error;

    say("Épisode publié. Il sera dans le flux RSS d'ici quelques minutes.", "ok");
    $("publish").reset();
  } catch (err) {
    for (const [bucket, path] of uploaded) await sb.storage.from(bucket).remove([path]);
    say("Erreur : " + (err.message || err), "err");
  } finally {
    btn.disabled = false;
  }
});

sb.auth.onAuthStateChange((_event, session) => show(session));
sb.auth.getSession().then(({ data }) => show(data.session));
</script>
</body>
</html>
